name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/nuextract.gguf
          key: nuextract-1.5-tiny-q4km

      - name: Baixar modelo NuExtract (vai dentro do APK)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -s app/src/main/assets/nuextract.gguf ]; then
            curl -L --fail --retry 3 -o app/src/main/assets/nuextract.gguf \
              https://huggingface.co/tensorblock/NuExtract-1.5-tiny-GGUF/resolve/main/NuExtract-1.5-tiny-Q4_K_M.gguf
          fi
          ls -la app/src/main/assets

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk OrcamentoJM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrcamentoJM
          path: OrcamentoJM.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orçamento JM (build ${{ github.run_number }})
          files: OrcamentoJM.apk
